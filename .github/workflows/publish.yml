name: Publish npm
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'release' || !github.event.release.prerelease)
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - name: Match release tag and package version
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'tacto-computer' || !/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Publish a stable v<package.json version> tag for tacto-computer.');
          }
          JS
      - name: Pack and verify publication contents
        run: |
          mkdir -p .Tacto-temp
          npm pack --pack-destination .Tacto-temp
          python3 tests/verify-package.py ".Tacto-temp/tacto-computer-$(node -p "require('./package.json').version").tgz"
      - name: Publish through npm trusted publisher
        run: npm publish ".Tacto-temp/tacto-computer-$(node -p "require('./package.json').version").tgz" --access public
